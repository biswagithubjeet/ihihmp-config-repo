server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/patient_db
    username: root
    password: ${PATIENT_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
